apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-auth
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.auth.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.auth.password | quote }}
  POSTGRES_DB: {{ .Values.db.auth.database | quote }}
# In production, replace this template with External Secrets / Sealed Secrets
# instead of storing plaintext credentials in values.yaml.
