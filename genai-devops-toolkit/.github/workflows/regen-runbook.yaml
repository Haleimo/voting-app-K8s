name: Regenerate RUNBOOK.md

on:
  pull_request:
    paths:
      - "voting-app/values.yaml"

jobs:
  regen-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Regenerate runbook
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python genai-devops-toolkit/runbook-gen/generate.py \
            --values voting-app/values.yaml \
            --out voting-app/RUNBOOK.md

      - name: Commit if changed
        run: |
          git config user.name "runbook-bot"
          git config user.email "runbook-bot@users.noreply.github.com"
          git add voting-app/RUNBOOK.md
          git diff --cached --quiet || git commit -m "docs: regenerate RUNBOOK.md from values.yaml"
          git push origin HEAD:${{ github.head_ref }}
